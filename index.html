<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta
         name="description"
         content="A private, offline-first weekly todo tracker."
      />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-title" content="True To-do" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="theme-color" content="#f5f6fb" />
      <link rel="icon" href="./favicon.ico" sizes="48x48" />
      <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
      <script>
         (() => {
            // Keep these page colors in sync with --page in src/index.css.
            const pageColor = { light: "#f5f6fb", dark: "#11141b" };
            const theme =
               localStorage.getItem("true-todo-theme") === "dark"
                  ? "dark"
                  : "light";
            if (theme === "dark") {
               document.documentElement.dataset.theme = "dark";
               document.documentElement.style.colorScheme = "dark";
            }
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", pageColor[theme]);
         })();
      </script>
      <title>True To-do</title>
     <script type="module" crossorigin src="/TrueTodo-Pages/assets/index-Q9kO7eDm.js"></script>
     <link rel="stylesheet" crossorigin href="/TrueTodo-Pages/assets/index-kbmnSOdV.css">
   <link rel="manifest" href="/TrueTodo-Pages/manifest.webmanifest"></head>
   <body>
      <noscript>You need to enable JavaScript to run this app.</noscript>
      <div id="root"></div>
   </body>
</html>
